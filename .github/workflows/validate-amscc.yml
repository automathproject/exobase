name: Validate AMSCC corpus

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate TeX sources
        run: python3 tools/check_exercise_sources.py content/exercises/amscc --max-errors=0
      - name: Validate taxonomy, aliases and Exo7 compatibility
        run: python3 tools/check_amscc_referential.py
